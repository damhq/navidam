name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Regenerate cleaned assessment data
        run: python scripts/clean_method_assessments.py
      - name: Compute assessment consensus status
        run: python scripts/assessment_consensus.py
      - name: Build with Jekyll
        run: bundle exec jekyll build
      - name: Check rendered pages
        run: bundle exec ruby tests/test_site_rendering.rb
