name: Method assessment
description: Submit a new method assessment or suggest a revision to an existing one
title: "[Assessment]: "
labels: ["method", "assessment"]
assignees:
  - estopinj
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this method assessment!
        Use this form both to submit a **new assessment** and to suggest a **revision**
        of an existing one (tick "Yes" below and give the exact method name).
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: input
    id: author
    attributes:
      label: Page’s Author
      description: "Your name (or a consistent pseudonym). Tick the box below to keep it off the website. Only one assessment per method and author is kept: submitting again under the same name replaces your previous assessment of that method. Note that this issue itself is public on GitHub."
      placeholder: ex. Jean Dupont
    validations:
      required: true
  - type: checkboxes
    id: anonymous
    attributes:
      label: "\u200B"
      options:
        - label: Anonymous contribution
          required: false

  - type: dropdown
    id: already_in_navidam
    attributes:
      label: Is the method already included in NaviDAM?
      description: Search NaviDAM first. If the method is already there (documented and/or assessed), please provide the exact same name below.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: input
    id: method_name
    attributes:
      label: METHOD NAME
      description: Name of method to be assessed, or exact name of the existing assessment to revise.
      placeholder: ex. Synthetic Control Method
    validations:
      required: true


  - type: markdown
    attributes:
      value: |
        ## Assessment logic
        - Situating the method against the unified criteria of NaviDAM will next enable users to filter down the approaches suited to their needs.
        - One entry can actually correspond to a family of methods (e.g. DiD).
          - In this case, the assessment should be based on the **most common** or **original** variant of the method, and add the options matching major & widespread variants.
        - To **revise an existing assessment**, fill in the full form with your suggested values; only criteria that differ from the current assessment will be proposed as changes for maintainer review.
        - **Several assessors can assess the same method.** Each submitted assessment is recorded as a vote. Confidence (1 to 5) affects vote weight, but its influence is softened using the square root of the score divided by 5. Similarity scores are squared to make partial matches count less. A criterion counts as agreed at 80% agreement; the method page shows **Consensus** when at least 80% of compared criteria are agreed (20 of 25 when all criteria are compared), otherwise **Debated** (a single assessment shows its confidence score instead). The published value of each criterion is the confidence-weighted majority; on an exact tie, the currently published value is kept. A maintainer reviews every change before it goes live. You can tick *Anonymous contribution* to appear as Anonymous. [Details in the Contributing guide](https://damhq.github.io/navidam/contributing/#assessment-status).
        - Rationale and comments can be added at the end of the form to justify the assessment or provide any additional information.

        *See the [criteria description](https://damhq.github.io/navidam/criteria) for more details on the criteria and how to assess them*


  - type: markdown
    attributes:
      value: |
        ## Method group

  - type: checkboxes
    id: category
    attributes:
      label: Category
      description: "Multiple: Tick all that apply & at least one (only for method page organization)"
      options:
        - label: "Counterfactual & future simulations"
        - label: "Experiments"
        - label: "Ecology-guided Modelling"
        - label: "Adjusted methods (Backdoor C.)"
        - label: "Quasi-experiments"
        - label: "Causal ML"
        - label: "Causal discovery"
        - label: "Alternative paradigms"
        - label: "Versatile tools"
        - label: "Independent detection"

  - type: dropdown
    id: sub_category
    attributes:
      label: Sub-category
      description: "Multiple, can be left unspecified (only for method page organization)"
      multiple: true
      options:
        - "Linear regressions & extensions"
        - "Predictive models +  interpretability metrics"
        - "Alternative effect identification methods"
        - "Meta-learners"
        - "Constraint-based methods"
        - "Score-based methods"
        - "Continuous optimization"
        - "Asymmetry-based"
        - "Prediction-based approaches"
        - "Intermediate confounding"
        - "Visualisation helpers"
        - "Robustness & significance tests"
        - "Causal interpretability"
        - "Uncertainty tools"
        - "Trend detection"
        - "RS breakpoint detection"
        - "Frequently monitored indices"
        - "Preliminary data correction"

  - type: markdown
    attributes:
      value: |
        ## Objective

  - type: checkboxes
    id: objective
    attributes:
      label: Objective
      description: Tick all the objectives that the method can address (at least one)
      options:
        - label: Effect estimation
        - label: Causal relationship(s)
        - label: Predictive task + interpretability
        - label: Detection
        - label: Significance and robustness tests
        - label: Scenario projection

  - type: markdown
    attributes:
      value: |
        ## Outcome
  
  - type: checkboxes
    id: estimand
    attributes:
      label: Estimand
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: ATT
        - label: ATE
        - label: LATE
        - label: CATE
        - label: Mediation effects
        - label: Oriented link
        - label: Risk ratios
        - label: Maps & generalisations
        - label: Abrupt change
        - label: Trend
        - label: Others
        - label: Inapplicable
  
  - type: markdown
    attributes:
      value: |
        ## Data compatibility
  
  - type: checkboxes
    id: data_type
    attributes:
      label: Type
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Spatial only (cross-sectional)
        - label: Time-series (one sample)
        - label: Panel data (many samples)
        - label: Inapplicable

  - type: dropdown # Ordinal criteria
    id: minimal_ts_length
    attributes:
      label: Minimal TS length
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - ≥ 100
        - ≥ 10
        - Handles ≤ 10
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: handles_few_samples
    attributes:
      label: Handles few samples
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - "No"
        - 10 to 100
        - Yes ≤ 10
        - Yes CT design
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: handles_huge_datasets
    attributes:
      label: Handles huge datasets (n)
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - "No"
        - Most dont
        - Most do
        - "Yes"
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: handles_missing_data
    attributes:
      label: Handles missing data
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - "No: requires prelim. correction"
        - Partially
        - "Yes"
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: rs_data_proven
    attributes:
      label: RS-data proven
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - "No"
        - Few applications
        - "Yes"
        - Inapplicable
    validations:
      required: true
  
  - type: markdown
    attributes:
      value: | 
        ## Model properties
  
  - type: checkboxes
    id: requires_explicit_processes
    attributes:
      label: Requires explicit processes
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: "Yes"
        - label: Optional
        - label: Agnostic
        - label: Inapplicable
  
  - type: checkboxes
    id: exposure_type
    attributes:
      label: Exposure type
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Binary
        - label: Categorical
        - label: Continuous / Time-varying
        - label: Compositional
        - label: Multivariate
        - label: Others
        - label: All
        - label: Inapplicable
  
  - type: checkboxes
    id: number_of_variables
    attributes:
      label: Number of variables
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Univariate
        - label: Bivariate
        - label: Multivariate
        - label: High-dimensional (p≫n)
        - label: Inapplicable
  
  - type: dropdown # Ordinal criteria
    id: propagates_uncertainty
    attributes:
      label: Propagates uncertainty
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - Needs model-agnostic propagation
        - Model-specific tools
        - Inherent capacity
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: handles_lag_effects
    attributes:
      label: Handles lag effects
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - "No"
        - Possible
        - "Yes"
        - Inapplicable
    validations:
      required: true

  - type: checkboxes
    id: parametric_nature
    attributes:
      label: Parametric nature
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Parametric
        - label: Semi-parametric
        - label: Non-parametric
        - label: Rule-based
        - label: Inapplicable

  - type: markdown
    attributes:
      value: | 
        ## Implementation
  
  - type: checkboxes
    id: language
    attributes:
      label: Language
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: R
        - label: Python
        - label: GIS
        - label: Others
        - label: No package
        - label: Inapplicable

  - type: checkboxes
    id: usage
    attributes:
      label: Usage
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: User-friendly
        - label: Technical but well documented
        - label: Sparse documentation
        - label: Domain-specific skills
        - label: Varying
        - label: Inapplicable

  - type: markdown
    attributes:
      value: |
        ## Assumptions
  
  - type: checkboxes
    id: functional_form
    attributes:
      label: Functional form
      description: "Multiple: Tick all that apply & at least one"
      options:
        - label: Linear
        - label: Quadratic
        - label: Non-linear
        - label: Additivity
        - label: Assumption-free
        - label: Rule-based
        - label: Log-linear
        - label: Inapplicable

  - type: dropdown # Ordinal criteria
    id: no_unobserved_confounders
    attributes:
      label: No unobserved confounders
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - Required
        - Recommended
        - Relaxes assumption
        - Inapplicable
    validations:
      required: true

  - type: dropdown # Ordinal criteria
    id: no_interference
    attributes:
      label: No interference
      description: "Multiple: Tick all that apply & at least one"
      options:
        - Required
        - Recommended
        - Relaxes assumption
        - Inapplicable
    validations:
      required: true

  - type: dropdown # Ordinal criteria
    id: well_defined_treatments
    attributes:
      label: Well-defined treatments
      description: "Multiple: Tick all that apply & at least one"
      options:
        - Required
        - Recommended
        - Relaxes assumption
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: common_support_positivity
    attributes:
      label: Common support (positivity)
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - Required
        - Recommended
        - Relaxes assumption
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: causal_markov_condition
    attributes:
      label: Causal Markov Condition
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - Required
        - Recommended
        - Relaxes assumption
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: faithfulness
    attributes:
      label: Faithfulness
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - Required
        - Recommended
        - Relaxes assumption
        - Inapplicable
    validations:
      required: true
  
  - type: dropdown # Ordinal criteria
    id: iid
    attributes:
      label: IID
      description: Ordinal from most to least permissive, pick highest option that applies.
      options:
        - Required
        - Recommended
        - Relaxes assumption
        - Inapplicable
    validations:
      required: true

  - type: checkboxes
    id: model_specific_assumptions
    attributes:
      label: Model-specific assumptions
      description: "Multiple: Tick all that apply"
      options:
        - label: Parallel trends
        - label: Stationarity
        - label: Demographic rates
        - label: Instrument validity
        - label: Normality of random effects
        - label: No M-O confounding
        - label: Good covariate balance
        - label: Effect entirely mediated
        - label: Cutoff + PO continuity
        - label: B/A treatment obs.
        - label: Good pretreatment fit
        - label: Time-varying or site-varying C.
        - label: Dynamic system
        - label: Non-Gaussian noise
        - label: Independent noise
        - label: Invariance across environments

  - type: dropdown # Ordinal criteria
    id: confidence
    attributes:
      label: Confidence in assessment
      description: How confident are you in your method assessment? Ordinal from least (1) to most (5) confident.
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Rationale and additional comments
      placeholder: Any rationale you would like to share about the method assessment, how/why some options were chosen, or any other comment you would like to share.
    validations:
      required: false


  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/damhq/navidam/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
